<style>
  :root {
    --bg: #f7f5f0;
    --panel: #ffffff;
    --line: #e8e4dc;
    --text: #18181b;
    --muted: #71717a;
    --soft: #a1a1aa;
    --hover: #f4f1ea;
    --sel: #18181b;
    --sel-text: #fafafa;
    --orange: #e85d04;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  .app { display: grid; grid-template-rows: 52px 1fr; height: 100%; }
  .top {
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    border: 0; background: transparent; padding: 8px 10px; cursor: pointer;
    color: var(--muted); font: inherit; font-weight: 600; font-size: 12px;
  }
  .tab.on { color: var(--text); box-shadow: inset 0 -2px 0 #18181b; }
  .search { flex: 1; max-width: 380px; }
  .search input {
    width: 100%; border: 1px solid var(--line); background: #fafafa;
    border-radius: 999px; padding: 8px 14px; font: inherit; outline: none;
  }
  .chips { display: flex; gap: 6px; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 4px 9px; font-size: 11px; cursor: pointer; color: var(--muted);
  }
  .chip.on { background: #18181b; color: #fff; border-color: #18181b; }
  .hint { color: var(--soft); font-size: 12px; white-space: nowrap; }
  .body { display: grid; grid-template-columns: 260px 300px 1fr; min-height: 0; }
  .body.page { grid-template-columns: 1fr; overflow: auto; background: var(--panel); }
  .side, .list, .detail { background: var(--panel); min-height: 0; overflow: auto; }
  .side { border-right: 1px solid var(--line); padding: 12px 10px 24px; }
  .list { border-right: 1px solid var(--line); }
  .sec { font-size: 10px; letter-spacing: .08em; color: var(--soft); font-weight: 700; margin: 12px 8px 6px; }
  .sec:first-child { margin-top: 2px; }
  .nav {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
  }
  .nav:hover { background: var(--hover); }
  .nav.on { background: #f4f1ea; font-weight: 650; }
  .nav .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge {
    width: 18px; height: 18px; border-radius: 4px; background: #f4f4f5;
    display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #52525b;
  }
  .nav.sub { padding-left: 34px; font-size: 12px; color: #3f3f46; }
  .nav.sub.on { background: var(--sel); color: var(--sel-text); }
  .nav.sub.on .n { color: #a1a1aa; }
  .chev {
    width: 16px; height: 16px; border: 0; background: transparent;
    color: #a1a1aa; font-size: 9px; padding: 0; cursor: pointer;
    display: grid; place-items: center; flex: 0 0 16px;
  }
  .chev:hover { color: #18181b; }
  .letter { padding: 10px 14px 4px; color: var(--soft); font-size: 11px; font-weight: 600; }
  .row {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 8px;
    align-items: center; padding: 7px 14px; cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--sel); color: var(--sel-text); }
  .row.on .when { color: #a1a1aa; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .detail { padding: 28px 36px 48px; }

  /* Shared company workflow graph (Louis 2026-08-26) */
  .wf { margin: 10px 0 4px; padding: 14px 12px 10px; background: #faf9f6; border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  .wf-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .wf-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .wf-pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 34px; padding: 6px 14px; border-radius: 999px;
    background: #c0266b; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .wf-box {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 34px; min-width: 92px; padding: 6px 12px; border-radius: 6px;
    background: #2563eb; color: #fff; font-size: 12px; font-weight: 600; text-align: center;
  }
  .wf-dia {
    width: 88px; height: 88px; display: flex; align-items: center; justify-content: center;
    background: #f97316; color: #fff; font-size: 11px; font-weight: 700; text-align: center;
    transform: rotate(45deg); border-radius: 8px; flex: 0 0 auto;
  }
  .wf-dia span { transform: rotate(-45deg); display: block; line-height: 1.2; padding: 4px; }
  .wf-arr { color: #a1a1aa; font-size: 16px; font-weight: 700; }
  .wf-arr-down { color: #a1a1aa; font-size: 14px; line-height: 1; }
  .wf-branch { display: flex; gap: 28px; align-items: flex-start; margin-left: 24px; flex-wrap: wrap; }
  .wf-path { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 120px; }
  .wf-tag { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

  .kicker { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; letter-spacing: .06em; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; flex-wrap: wrap; }
  .pill { background: #fff7ed; color: var(--orange); border-radius: 999px; padding: 2px 8px; font-size: 10px; letter-spacing: 0; }
  h1 { font-size: 28px; margin: 0 0 4px; font-weight: 650; letter-spacing: -.02em; }
  .id { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 12px; margin-bottom: 12px; }
  .card-line { padding: 12px 0; border-bottom: 1px solid var(--line); max-width: 62ch; }
  .card-line b { display: block; font-size: 11px; letter-spacing: .06em; color: var(--soft); margin-bottom: 4px; }
  .card-line span { font-size: 15px; line-height: 1.45; color: #18181b; }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .flow .box { border: 1px solid #18181b; padding: 7px 9px; font-size: 12px; background: #fff; max-width: 140px; }
  .flow .arr { color: var(--soft); font-size: 12px; }
  .brain-link { color: #18181b; font-size: 15px; }
  .metrics { display: flex; gap: 18px; margin-top: 20px; }
  .metrics b { display: block; color: var(--orange); font-size: 20px; }
  .metrics span { color: var(--muted); font-size: 11px; }
  .say { margin-top: 18px; color: var(--muted); font-size: 13px; }
  .say b { color: var(--text); }
  .empty { color: var(--muted); padding: 24px; }
  .foot { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--soft); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  .page-inner { max-width: 720px; padding: 28px 36px 64px; }
  .page-inner h1 { font-size: 28px; margin: 0 0 8px; font-weight: 650; letter-spacing: -.02em; }
  .page-inner .lead { color: #3f3f46; line-height: 1.55; font-size: 14px; max-width: 62ch; margin: 0 0 28px; }
  .quiet { font-size: 10px; letter-spacing: .08em; color: var(--soft); font-weight: 700; margin: 28px 0 10px; }
  .bar { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .bar:last-child { border-bottom: 0; }
  .bar i { display: block; height: 6px; background: #18181b; border-radius: 99px; }
  .bar em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .earn-row, .debt { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #3f3f46; }
  .earn-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .skill-link { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .debt { display: flex; flex-wrap: wrap; gap: 6px 10px; color: var(--muted); }
  .fp-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .fp-item b { display: block; margin-bottom: 4px; }
  .fp-item span { color: #3f3f46; line-height: 1.5; }
  .steps { color: #3f3f46; line-height: 1.8; font-size: 14px; }
  .pits { color: var(--muted); line-height: 1.7; font-size: 13px; }
  .phone-back {
    display: none; width: 100%; border: 0; background: #fff; color: #18181b;
    text-align: left; padding: 12px 14px; font: inherit; font-weight: 650;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  @media (max-width: 800px) {
    html, body { height: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    .app { height: 100dvh; grid-template-rows: auto 1fr; }
    .top {
      flex-wrap: wrap; height: auto; align-items: center;
      padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
      gap: 8px;
    }
    .brand { width: 100%; font-size: 13px; }
    .tabs { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tab { padding: 10px 12px; font-size: 13px; white-space: nowrap; }
    .search { flex: 1 1 100%; max-width: none; }
    .search input { font-size: 16px; padding: 10px 14px; }
    .chips { flex-wrap: wrap; }
    .chip { padding: 7px 10px; font-size: 12px; }
    .body:not(.page) { grid-template-columns: 1fr; }
    .body.phone-depts .list, .body.phone-depts .detail { display: none; }
    .body.phone-list .side, .body.phone-list .detail { display: none; }
    .body.phone-card .side, .body.phone-card .list { display: none; }
    .phone-back { display: block; min-height: 44px; }
    .side, .list, .detail { min-height: 0; }
    .row { min-height: 44px; padding: 10px 14px; }
    .nav { min-height: 44px; }
    .detail { padding: 16px 16px 48px; }
    h1, .page-inner h1 { font-size: 22px; }
    .page-inner { padding: 18px 16px 56px; max-width: none; }
    .metrics { flex-wrap: wrap; gap: 14px 18px; }
    .metrics > div { min-width: 42%; }
    .bar { grid-template-columns: 86px 1fr 36px; }
    .flow .box { max-width: none; }
    .earn-row { gap: 8px; }
    .nm { font-size: 14px; }
  }
</style>

  const needle = q.trim().toLowerCase();
  return SKILLS.filter(s => {
    if (!needle && shelf !== "all" && (s.shelf || "drawer") !== shelf) return false;
    if (dept !== "ALL" && s.dept !== dept) return false;
    if (stage !== "ALL" && s.stage !== stage) return false;
    if (perm === "ok" && s.perm !== "team-safe") return false;
    if (perm === "louis" && s.perm !== "louis-only") return false;
    if (perm === "review" && s.perm && s.perm !== "team-safe" && s.perm !== "louis-only") return false;
    if (needle && !hay(s).includes(needle)) return false;
    return true;
  });
}
function renderShelf() {
  const items = [["counter", L("shelfCounter")],["drawer", L("shelfDrawer")],["twin", L("shelfTwin")],["all", L("shelfAll")]];
  document.getElementById("shelf").innerHTML = items.map(([k,l]) =>
    `<button class="chip ${shelf===k?"on":""}" data-shelf="${k}">${l}</button>`
  ).join("");
}
function stats() {
  const n = SKILLS.length;
  const ok = SKILLS.filter(s => s.perm === "team-safe").length;
  const louis = SKILLS.filter(s => s.perm === "louis-only").length;
  const act = SKILLS.reduce((a,s) => a + s.activity, 0);
  const earn = SKILLS.filter(s => s.earn).length;
  const debt = SKILLS.filter(s => s.activity === 0).length;
  return {n, ok, louis, act, earn, debt};
}
function renderPerm() {
  const items = [["ALL",L("all")],["ok",L("approved")],["louis",L("louis")],["review",L("review")]];
  document.getElementById("perm").innerHTML = items.map(([k,l]) =>
    `<button class="chip ${perm===k?"on":""}" data-perm="${k}">${l}</button>`
  ).join("");
}
function renderSide() {
  const pool = SKILLS.filter(s => shelf === "all" || (s.shelf || "drawer") === shelf);
  const c = { ALL: pool.length };
  const sc = {};
  for (const d of DEPTS) { c[d[0]] = 0; sc[d[0]] = {}; }
  for (const s of pool) {
    c[s.dept] = (c[s.dept] || 0) + 1;
    sc[s.dept][s.stage] = (sc[s.dept][s.stage] || 0) + 1;
  }
  let h = `<div class="sec">${L("library")}</div>
    <div class="nav ${dept==="ALL"?"on":""}" data-dept="ALL" data-stage="ALL"><span class="badge">*</span><span>${L("allSkills")}</span><span class="n">${c.ALL}</span></div>
    <div class="sec">${L("departments")}</div>`;
  for (const d of DEPTS) {
    const [id, , letter] = d;
    const isOpen = openDepts.has(id);
    h += `<div class="nav ${dept===id&&stage==="ALL"?"on":""}" data-dept="${id}" data-stage="ALL"><button class="chev" data-toggle="${id}">${isOpen?"▼":"▶"}</button><span class="badge">${letter}</span><span>${deptName(d)}</span><span class="n">${c[id]||0}</span></div>`;
    if (!isOpen) continue;
    for (const st of (STAGE_ORDER[id] || [])) {
      const n = sc[id][st] || 0;
      h += `<div class="nav sub ${dept===id&&stage===st?"on":""}" data-dept="${id}" data-stage="${st}"><span>${stageName(st)}</span><span class="n">${n}</span></div>`;
    }
  }
  document.getElementById("side").innerHTML = h;
}
function renderList() {
  let rows = filtered().slice();
  if (dept === "CRON") {
    const order = STAGE_ORDER.CRON || [];
    rows.sort((a,b) => {
      const ia = order.indexOf(a.stage), ib = order.indexOf(b.stage);
      const da = ia < 0 ? 99 : ia, db = ib < 0 ? 99 : ib;
      if (da !== db) return da - db;
      return String(a.title||a.name).localeCompare(String(b.title||b.name));
    });
  } else {
    rows.sort((a,b) => a.name.localeCompare(b.name));
  }
  const box = document.getElementById("list");
  if (!rows.length) { box.innerHTML = phoneBack(L("backDepts"), "depts") + `<div class="empty">${L("noMatch")}</div>`; return; }
  if (!rows.some(s => s.name === selected)) selected = rows[0].name;
  let last = "", h = phoneBack(L("backDepts"), "depts");
  for (const s of rows) {
    const head = dept === "CRON" ? (s.stage || "Other") : s.name[0].toUpperCase();
    if (head !== last) { h += `<div class="letter">${esc(dept==="CRON" ? stageName(head) : head)}</div>`; last = head; }
    h += `<div class="row ${s.name===selected?"on":""}" data-name="${esc(s.name)}">
      <span class="dot" style="background:${s.dot}"></span>
      <span class="nm">${esc(s.title || s.name)}</span>
      <span class="when">${esc(s.kind === "Clock" || dept==="CRON" ? (s.kind+" · "+s.last) : s.last)}</span>
    </div>`;
  }
  box.innerHTML = h;
}
function sharedWorkflowGraph() {
  // One company picture for every skill (Louis lock 2026-08-26)
  const zh = lang === "zh";
  const t = zh ? {
    start: "有人提出", gather: "收集事实", work: "做工作",
    ask: "要老板点头吗？", yes: "要", no: "不要",
    boss: "老板决定", finish: "完成并保存证据", done: "完成"
  } : {
    start: "Someone asks", gather: "Gather facts", work: "Do the work",
    ask: "Need boss yes?", yes: "Yes", no: "No",
    boss: "Boss decides", finish: "Finish + save proof", done: "Done"
  };
  return `<div class="card-line"><b>${L("graph")}</b>
    <div class="wf" aria-label="workflow">
      <div class="wf-row">
        <span class="wf-pill">${esc(t.start)}</span><span class="wf-arr">→</span>
        <span class="wf-box">${esc(t.gather)}</span><span class="wf-arr">→</span>
        <span class="wf-box">${esc(t.work)}</span><span class="wf-arr">→</span>
        <div class="wf-dia"><span>${esc(t.ask)}</span></div>
      </div>
      <div class="wf-branch">
        <div class="wf-path">
          <span class="wf-tag">${esc(t.no)}</span>
          <span class="wf-arr-down">↓</span>
          <span class="wf-box">${esc(t.finish)}</span>
          <span class="wf-arr-down">↓</span>
          <span class="wf-pill">${esc(t.done)}</span>
        </div>
        <div class="wf-path">
          <span class="wf-tag">${esc(t.yes)}</span>
          <span class="wf-arr-down">↓</span>
          <span class="wf-box">${esc(t.boss)}</span>
          <span class="wf-arr-down">↓</span>
          <span class="wf-box">${esc(t.finish)}</span>
          <span class="wf-arr-down">↓</span>
          <span class="wf-pill">${esc(t.done)}</span>
        </div>
      </div>
    </div>
  </div>`;
}
function renderDetail() {
  const s = SKILLS.find(x => x.name === selected) || filtered()[0];
  const box = document.getElementById("detail");
  if (!s) { box.innerHTML = phoneBack(L("backSkills"), "list") + `<div class="empty">${L("pick")}</div>`; return; }
  const cat = (DEPTS.find(d => d[0]===s.dept) || [s.dept,s.cat]) ;
  box.innerHTML = phoneBack(L("backSkills"), "list") + `
    <div class="kicker"><span class="dot" style="background:${s.dot}"></span>${esc(deptName(cat))} · ${esc(stageName(s.stage))}${s.earn ? '<span class="pill">'+L("earn")+'</span>' : ""}</div>
    <h1>${esc(s.title)}</h1>
    <div class="card-line"><b>${L("does")}</b><span>${esc(txt(s,"does","does_zh"))}</span></div>
    <div class="card-line"><b>${L("say")}</b><span>${esc(s.say)}</span></div>
    <div class="card-line"><b>${L("give")}</b><span>${esc(txt(s,"give","give_zh"))}</span></div>
    <div class="card-line"><b>${L("get")}</b><span>${esc(txt(s,"get","get_zh"))}</span></div>
    <div class="card-line"><b>${L("gate")}</b><span>${esc(txt(s,"gate","gate_zh"))}</span></div>
    <div class="card-line"><b>${L("done")}</b><span>${esc(txt(s,"done","done_zh"))}</span></div>
    <div class="card-line"><b>${L("dont")}</b><span>${esc(txt(s,"dont","dont_zh"))}</span></div>
    ${sharedWorkflowGraph()}
    <div class="card-line"><b>${L("improve")}</b><span>${esc(L("improveB"))}</span></div>
    <div class="card-line"><b>${L("made")}</b><span>${esc(s.creator)}</span></div>
    <div class="card-line"><b>${L("ver")}</b><span>${esc(s.version || "—")}</span></div>
    <div class="card-line"><b>${L("changed")}</b><span>${esc(s.stamp)}</span></div>
    <div class="foot">${esc(s.name)}${s.uses ? " · "+s.uses+" "+L("uses") : ""}</div>`;
}
function renderOverview() {
  const st = stats();
  const by = {};
  for (const d of DEPTS) by[d[0]] = 0;
  for (const s of SKILLS) by[s.dept] = (by[s.dept] || 0) + s.activity;
  const max = Math.max(1, ...Object.values(by));
  const bars = DEPTS.map((d) => {
    const v = by[d[0]] || 0;
    return `<div class="bar"><span>${deptName(d)}</span><i style="width:${Math.round(v/max*100)}%"></i><em>${v}</em></div>`;
  }).join("");
  const board = {};
  for (const s of SKILLS) {
    const c = s.creator || "Unknown";
    if (!board[c]) board[c] = { n: 0, uses: 0 };
    board[c].n += 1;
    board[c].uses += s.uses || 0;
  }
  const boardRows = Object.entries(board).sort((a,b) => b[1].n - a[1].n)
    .map(([name, v], i) => `<div class="earn-row"><span>${i+1}. ${esc(name)}</span><span>${v.n} ${L("skillsN")} · ${v.uses} ${L("usesN")}</span></div>`).join("");
  const top = SKILLS.filter(s => s.earn).sort((a,b) => b.activity - a.activity)
    .map(s => `<div class="earn-row skill-link" data-skill="${esc(s.name)}"><span>${esc(s.name)}</span><span>${s.activity}</span></div>`).join("");
  const debt = SKILLS.filter(s => s.activity === 0).map(s => s.name);
  const shown = debt.slice(0, 24).map(n => `<span class="skill-link" data-skill="${esc(n)}">${esc(n)}</span>`).join(" · ");
  const more = debt.length > 24 ? ` · +${debt.length-24} more` : "";
  document.getElementById("body").innerHTML = `<div class="page-inner">
    <div class="kicker">${L("overview")}</div>
    <h1>${L("earnH")}</h1>
    <p class="lead">${L("rebuilt")}: ${esc(AUDIT.when)}<br>${L("next")}</p>
    <div class="quiet">${L("audit")}</div>
    <div class="metrics">
      <div><b>${AUDIT.unknown}</b><span>${L("unknown")}</span></div>
      <div><b>${AUDIT.review}</b><span>${L("reviewN")}</span></div>
      <div><b>${AUDIT.debt}</b><span>${L("never")}</span></div>
      <div><b>${AUDIT.need_graph}</b><span>${L("needGraph")}</span></div>
    </div>
    <p class="lead">${(UI[lang]||UI.en).lead(st)}</p>
    <div class="metrics">
      <div><b>${st.n}</b><span>${L("skills")}</span></div>
      <div><b>${st.earn}</b><span>${L("earnRent")}</span></div>
      <div><b>${st.debt}</b><span>${L("never")}</span></div>
      <div><b>${st.ok}</b><span>${L("ok")}</span></div>
    </div>
    <div class="quiet">${L("board")}</div>
    ${boardRows}
    <div class="quiet">${L("byDept")}</div>
    ${bars}
    <div class="quiet">${L("top20")}</div>
    ${top}
    <div class="quiet">${(UI[lang]||UI.en).debt(debt.length)}</div>
    <div class="debt">${shown}${more}</div>
  </div>`;
}
function renderFP() {
  document.getElementById("body").innerHTML = `<div class="page-inner">
    <div class="kicker">${L("fpK")}</div>
    <h1>${L("five")}</h1>
    <p class="lead">${L("fpLead")}</p>
    <div class="fp-item"><b>${L("t1")}</b><span>${L("t1b")}</span></div>
    <div class="fp-item"><b>${L("t2")}</b><span>${L("t2b")}</span></div>
    <div class="fp-item"><b>${L("t3")}</b><span>${L("t3b")}</span></div>
    <div class="fp-item"><b>${L("t4")}</b><span>${L("t4b")}</span></div>
    <div class="fp-item"><b>${L("t5")}</b><span>${L("t5b")}</span></div>
    <div class="quiet">${L("loop")}</div>
    <div class="steps">${L("steps")}</div>
    <div class="quiet">${L("traps")}</div>
    <div class="pits">${L("pits")}</div>
  </div>`;
}
function renderLibShell() {
  document.getElementById("body").className = "body";
  document.getElementById("body").innerHTML = `<aside class="side" id="side"></aside><nav class="list" id="list"></nav><main class="detail" id="detail"></main>`;
  document.getElementById("side").addEventListener("click", e => {
    const tog = e.target.closest("[data-toggle]");
    if (tog) {
      e.preventDefault();
      e.stopPropagation();
      const id = tog.dataset.toggle;
      if (openDepts.has(id)) openDepts.delete(id); else openDepts.add(id);
      saveOpen();
      renderSide();
      return;
    }
    const n = e.target.closest(".nav"); if (!n) return;
    dept = n.dataset.dept; stage = n.dataset.stage || "ALL";
    if (dept !== "ALL") { openDepts.add(dept); saveOpen(); }
    if (isPhone()) phonePane = "list";
    paint();
  });
  document.getElementById("list").addEventListener("click", e => {
    const n = e.target.closest(".row"); if (!n) return;
    selected = n.dataset.name;
    if (isPhone()) phonePane = "card";
    renderList(); renderDetail(); applyPhonePane();
  });
}
function openSkill(name) {
  if (!SKILLS.some(s => s.name === name)) return;
  selected = name;
  view = "lib";
  dept = "ALL";
  stage = "ALL";
  q = "";
  const box = document.getElementById("q");
  if (box) box.value = "";
  renderLibShell();
  phonePane = "card";
  paint();
  const el = document.querySelector(".row.on");
  if (el) el.scrollIntoView({block: "center"});
}
function paint() {
  chrome();
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === view));
  renderPerm();
  renderShelf();
  const rows = (view === "lib") ? filtered() : [];
  if (rows.length && !rows.some(s => s.name === selected)) selected = rows[0].name;
  if (!selected) {
    const hire = SKILLS.find(s => s.name === "hr-hire-people")
      || SKILLS.find(s => s.name === "people-recruiting");
    selected = (hire || SKILLS.find(s => s.shelf === "counter") || SKILLS[0] || {}).name || "";
  }
  if (view === "over") { document.getElementById("body").className = "body page"; renderOverview(); return; }
  if (view === "fp") { document.getElementById("body").className = "body page"; renderFP(); return; }
  if (!document.getElementById("side")) renderLibShell();
  renderSide(); renderList(); renderDetail();
  applyPhonePane();
}
document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  view = t.dataset.view;
  if (view === "lib") { phonePane = "depts"; renderLibShell(); }
  paint();
});
document.addEventListener("click", e => {
  const back = e.target.closest("[data-phone]");
  if (back) {
    phonePane = back.dataset.phone;
    applyPhonePane();
    return;
  }
  const n = e.target.closest("[data-skill]");
  if (!n) return;
  e.preventDefault();
  openSkill(n.dataset.skill);
});
document.getElementById("lang").addEventListener("click", e => {
  const c = e.target.closest("[data-lang]"); if (!c) return;
  lang = c.dataset.lang;
  try { localStorage.setItem("dojo-lang", lang); } catch (e) {}
  paint();
});
document.getElementById("perm").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  perm = c.dataset.perm; if (view !== "lib") { view = "lib"; renderLibShell(); } paint();
});
document.getElementById("shelf").addEventListener("click", e => {
  const c = e.target.closest("[data-shelf]"); if (!c) return;
  shelf = c.dataset.shelf; if (view !== "lib") { view = "lib"; renderLibShell(); } paint();
});
document.getElementById("q").addEventListener("input", e => {
  q = e.target.value; if (view !== "lib") { view = "lib"; renderLibShell(); }
  if (isPhone() && q.trim()) phonePane = "list";
  paint();
});
document.addEventListener("keydown", e => {
  if (view !== "lib") return;
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const rows = filtered();
  const i = rows.findIndex(s => s.name === selected);
  const next = e.key === "ArrowDown" ? Math.min(rows.length-1, i+1) : Math.max(0, i-1);
  if (rows[next]) { selected = rows[next].name; renderList(); renderDetail();
    const el = document.querySelector(".row.on"); if (el) el.scrollIntoView({block:"nearest"}); }
  e.preventDefault();
});
window.addEventListener("resize", () => { if (view === "lib") applyPhonePane(); });
paint();
</script>
</body>
</html>
