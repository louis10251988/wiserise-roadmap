<div id="tip"></div>
<script>
const tip = document.getElementById('tip');
document.querySelectorAll('.node').forEach(n => {
  n.addEventListener('mousemove', e => {
    const d = n.dataset;
    tip.innerHTML = `<div class="tname">${d.name}</div>
<div class="tmeta">${d.type} · LV ${d.lv || 'TBD'} ${d.mine === '1' ? '· ★ YOURS' : ''}</div>
<div class="tdesc">${d.desc}</div>
<div class="trow"><b>Trigger:</b> ${d.trigger}</div>
<div class="trow"><b>Requires:</b> ${d.req}</div>
<div class="trow"><b>Gate:</b> ${d.gate}</div>
<div class="trow"><b>Proof:</b> ${d.proof}</div>
<div class="tfoot">Owner: ${d.owner} · Verified: ${d.verified} · Bot: ${d.bot}</div>`;
    tip.style.display = 'block';
    let tx = e.clientX + 18, ty = e.clientY + 14;
    if (tx + 350 > window.innerWidth) tx = e.clientX - 360;
    if (ty + 260 > window.innerHeight) ty = e.clientY - 240;
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
  });
  n.addEventListener('mouseleave', () => tip.style.display = 'none');
});
</script></body></html>
